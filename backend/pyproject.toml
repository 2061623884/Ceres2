[project]
name = "ceres2-backend"
version = "0.1.0"
description = "Ceres2 canonical business API and LangGraph runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "httpx>=0.27.0",
  "socksio==1.0.0",
  "pillow==12.3.0",
  "openai>=1.12.0",
  "langgraph==1.2.12",
  "langgraph-checkpoint-sqlite==3.1.1",
  "sse-starlette>=2.1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
